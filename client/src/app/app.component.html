<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="brand">
      <span class="brand-mark">QG</span>
      <span class="brand-name">Quiz Gaming</span>
    </a>

    @if (authService.isAuthenticated()) {
      <div class="app-header__user">
        <span class="app-header__username">{{ authService.username() }}</span>
        <button type="button" class="btn btn-secondary" (click)="authService.logout()">Se déconnecter</button>
      </div>
    }
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
