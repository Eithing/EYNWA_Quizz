<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="brand">
      <span class="brand-mark">QP</span>
      <span class="brand-name">Quiz Party</span>
    </a>

    @if (authService.isAuthenticated()) {
      <div class="app-header__user">
        @if (authService.currentUser(); as user) {
          @if (user.avatarUrl) {
            <img [src]="user.avatarUrl" [alt]="user.username" class="app-header__avatar" />
          }
          <span class="app-header__username">{{ user.username }}</span>
        }
        <button type="button" class="btn btn-secondary" (click)="authService.logout()">Se déconnecter</button>
      </div>
    }
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>

<app-loading-overlay />
