<div class="image-guess-question-editor">
  <div class="form-field">
    <label>Image</label>

    @if (payload().imageUrl) {
      <img class="image-guess-question-editor__preview" [src]="resolveImageUrl(payload().imageUrl)" alt="Image de la question" />
    }

    <app-media-upload-field
      accept="image/png,image/jpeg,image/webp,image/gif"
      [hasFile]="!!payload().imageUrl"
      chooseLabel="Choisir une image"
      changeLabel="Changer l'image"
      errorMessage="Échec de l'envoi de l'image."
      (uploaded)="onImageUploaded($event)"
    />
  </div>

  <div class="form-field">
    <label for="image-guess-comment">Commentaire / consigne (optionnel)</label>
    <textarea
      id="image-guess-comment"
      rows="2"
      placeholder="Ex : Donnez le nom de l'objet et du jeu"
      [value]="payload().comment"
      (input)="onCommentChange($any($event.target).value)"
    ></textarea>
  </div>

  <div class="form-field">
    <label for="image-guess-points-mode-override">Points pour cette question</label>
    <select id="image-guess-points-mode-override" [value]="payload().pointsModeOverride ?? ''" (change)="onPointsModeOverrideChange($any($event.target).value)">
      <option value="">Suivre la manche</option>
      <option value="Uniform">Uniforme</option>
      <option value="PerAnswer">Personnalisé</option>
    </select>
  </div>

  <app-expected-answers-editor
    [expectedAnswers]="payload().expectedAnswers"
    [pointsMode]="effectivePointsMode()"
    (expectedAnswersChange)="onExpectedAnswersChange($event)"
  />
</div>
