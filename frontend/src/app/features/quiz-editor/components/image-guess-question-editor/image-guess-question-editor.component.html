<div class="image-guess-question-editor">
  <div class="form-field">
    <label>Image</label>

    @if (payload().imageUrl) {
      <img class="image-guess-question-editor__preview" [src]="resolveImageUrl(payload().imageUrl)" alt="Image de la question" />
    }

    <label class="image-guess-question-editor__upload">
      <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" (change)="onFileSelected($event)" [disabled]="uploading()" />
      <span>{{ uploading() ? 'Envoi en cours…' : payload().imageUrl ? "Changer l'image" : 'Choisir une image' }}</span>
    </label>

    @if (uploadError(); as message) {
      <p class="image-guess-question-editor__error">{{ message }}</p>
    }
  </div>

  <div class="form-field">
    <label for="image-guess-accepted-answers">Réponses acceptées (séparées par des virgules)</label>
    <input
      id="image-guess-accepted-answers"
      type="text"
      placeholder="Ex : Zelda, The Legend of Zelda"
      [value]="acceptedAnswersText()"
      (input)="onAcceptedAnswersChange($any($event.target).value)"
    />
  </div>
</div>
