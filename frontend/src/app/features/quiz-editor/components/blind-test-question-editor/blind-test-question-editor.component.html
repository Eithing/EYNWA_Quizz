<div class="blind-test-question-editor">
  <div class="form-field">
    <label>Fichier audio</label>

    @if (payload().audioUrl) {
      <app-audio-player [audioUrl]="resolveAudioUrl(payload().audioUrl)" [showTimeline]="true" />
    }

    <app-media-upload-field
      accept="audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/x-m4a"
      [hasFile]="!!payload().audioUrl"
      chooseLabel="Choisir un fichier audio"
      changeLabel="Changer le fichier"
      errorMessage="Échec de l'envoi du fichier audio."
      (uploaded)="onAudioUploaded($event)"
    />
  </div>

  <div class="form-field">
    <label for="blind-test-comment">Commentaire / consigne (optionnel)</label>
    <textarea
      id="blind-test-comment"
      rows="2"
      placeholder="Ex : Soyez précis"
      [value]="payload().comment"
      (input)="onCommentChange($any($event.target).value)"
    ></textarea>
  </div>

  <div class="form-field">
    <label for="blind-test-points-mode-override">Points pour cette question</label>
    <select id="blind-test-points-mode-override" [value]="payload().pointsModeOverride ?? ''" (change)="onPointsModeOverrideChange($any($event.target).value)">
      <option value="">Suivre la manche ({{ roundPointsMode() === 'PerAnswer' ? 'Personnalisé' : 'Uniforme' }})</option>
      <option value="Uniform">Uniforme</option>
      <option value="PerAnswer">Personnalisé</option>
    </select>
  </div>

  <app-expected-answers-editor
    [expectedAnswers]="payload().expectedAnswers"
    [pointsMode]="effectivePointsMode()"
    (expectedAnswersChange)="onExpectedAnswersChange($event)"
  />
</div>
