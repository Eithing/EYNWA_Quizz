<div class="blind-test-question-editor">
  <div class="form-field">
    <label>Fichier audio</label>

    @if (payload().audioUrl) {
      <app-audio-player [audioUrl]="resolveAudioUrl(payload().audioUrl)" [showTimeline]="true" />
    }

    <label class="blind-test-question-editor__upload">
      <input type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/x-m4a" (change)="onFileSelected($event)" [disabled]="uploading()" />
      <span>{{ uploading() ? 'Envoi en cours…' : payload().audioUrl ? "Changer le fichier" : 'Choisir un fichier audio' }}</span>
    </label>

    @if (uploadError(); as message) {
      <p class="blind-test-question-editor__error">{{ message }}</p>
    }
  </div>

  <app-expected-answers-editor
    [expectedAnswers]="payload().expectedAnswers"
    [pointsMode]="pointsMode()"
    (expectedAnswersChange)="onExpectedAnswersChange($event)"
  />
</div>
