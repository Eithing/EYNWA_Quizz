<div class="zoom-question-editor">
  <div class="form-field">
    <label>Image</label>

    @if (payload().imageUrl) {
      <div class="zoom-question-editor__picker" (click)="onImageClick($event)">
        <img [src]="resolveImageUrl(payload().imageUrl)" alt="Image de la question" />
        <span
          class="zoom-question-editor__marker"
          [style.left]="(payload().zoomFocusPoint.x * 100) + '%'"
          [style.top]="(payload().zoomFocusPoint.y * 100) + '%'"
        ></span>
      </div>
      <p class="zoom-question-editor__hint">Clique sur l'image pour définir le point de zoom.</p>
    }

    <app-media-upload-field
      accept="image/png,image/jpeg,image/webp,image/gif"
      [hasFile]="!!payload().imageUrl"
      chooseLabel="Choisir une image"
      changeLabel="Changer l'image"
      errorMessage="Échec de l'envoi de l'image."
      (uploaded)="onImageUploaded($event)"
    />
  </div>

  <div class="form-field">
    <label for="zoom-comment">Commentaire / consigne (optionnel)</label>
    <textarea
      id="zoom-comment"
      rows="2"
      placeholder="Ex : Donnez le nom de l'objet et du jeu"
      [value]="payload().comment"
      (input)="onCommentChange($any($event.target).value)"
    ></textarea>
  </div>

  <div class="form-field">
    <label for="zoom-points-mode-override">Points pour cette question</label>
    <select id="zoom-points-mode-override" [value]="payload().pointsMode ?? ''" (change)="onPointsModeOverrideChange($any($event.target).value)">
      <option value="">Suivre la manche ({{ roundPointsMode() === 'PerAnswer' ? 'Personnalisé' : 'Uniforme (dézoom)' }})</option>
      <option value="Uniform">Uniforme (dézoom)</option>
      <option value="PerAnswer">Personnalisé</option>
    </select>
  </div>

  <app-expected-answers-editor
    [expectedAnswers]="payload().expectedAnswers"
    [pointsMode]="effectivePointsMode()"
    (expectedAnswersChange)="onExpectedAnswersChange($event)"
  />
</div>
