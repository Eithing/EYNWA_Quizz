<div class="qa-round-config">
  <label class="qa-round-config__checkbox">
    <input type="checkbox" [checked]="config().buzzerMode" (change)="onBuzzerModeChange($any($event.target).checked)" />
    Question de rapidité (buzzer) : les joueurs buzzent pour obtenir la main, validation toujours à l'oral
  </label>

  <div class="qa-round-config__row">
    @if (!config().buzzerMode) {
      <div class="form-field">
        <label for="qa-validation-mode">Validation des réponses</label>
        <select id="qa-validation-mode" [value]="config().validationMode" (change)="onValidationModeChange($any($event.target).value)">
          <option value="Auto">Automatique (à l'écrit, tolérance aux fautes)</option>
          <option value="Manual">Manuelle (à l'oral, l'hôte valide)</option>
        </select>
      </div>
    }

    <div class="form-field">
      <label for="qa-answer-time">Temps de réponse (s)</label>
      <input
        id="qa-answer-time"
        type="number"
        min="1"
        [value]="config().answerTimeSeconds"
        (input)="onAnswerTimeChange($any($event.target).valueAsNumber)"
      />
    </div>

    <div class="form-field">
      <label for="qa-points">Points par bonne réponse</label>
      <input
        id="qa-points"
        type="number"
        min="0"
        [value]="config().points"
        (input)="onPointsChange($any($event.target).valueAsNumber)"
      />
    </div>
  </div>

  <label class="qa-round-config__checkbox">
    <input type="checkbox" [checked]="config().autoAdvance" (change)="onAutoAdvanceChange($any($event.target).checked)" />
    Passer automatiquement à la question suivante une fois le temps écoulé
  </label>
</div>
