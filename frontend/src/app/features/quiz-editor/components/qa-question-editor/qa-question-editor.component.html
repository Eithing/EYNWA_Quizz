<div class="qa-question-editor">
  <div class="form-field">
    <label for="qa-question-text">Question</label>
    <textarea
      id="qa-question-text"
      rows="3"
      placeholder="Ex : Quelle est la capitale de l'Islande ?"
      [value]="payload().questionText"
      (input)="onQuestionTextChange($any($event.target).value)"
    ></textarea>
  </div>

  <div class="form-field">
    <label for="qa-points-mode-override">Points pour cette question</label>
    <select id="qa-points-mode-override" [value]="payload().pointsModeOverride ?? ''" (change)="onPointsModeOverrideChange($any($event.target).value)">
      <option value="">Suivre la manche ({{ roundPointsMode() === 'PerAnswer' ? 'Personnalisé' : 'Uniforme' }})</option>
      <option value="Uniform">Uniforme</option>
      <option value="PerAnswer">Personnalisé</option>
    </select>
  </div>

  <app-expected-answers-editor
    [expectedAnswers]="payload().expectedAnswers"
    [pointsMode]="effectivePointsMode()"
    (expectedAnswersChange)="onExpectedAnswersChange($event)"
  />
</div>
