<div class="qcm-question-editor">
  <div class="form-field">
    <label for="qcm-question-text">Question</label>
    <textarea
      id="qcm-question-text"
      rows="3"
      placeholder="Ex : Lesquelles de ces villes sont des capitales ?"
      [value]="payload().questionText"
      (input)="onQuestionTextChange($any($event.target).value)"
    ></textarea>
  </div>

  <div class="form-field">
    <label for="qcm-points-mode-override">Points pour cette question</label>
    <select id="qcm-points-mode-override" [value]="payload().pointsModeOverride ?? ''" (change)="onPointsModeOverrideChange($any($event.target).value)">
      <option value="">Suivre la manche</option>
      <option value="Uniform">Uniforme</option>
      <option value="PerAnswer">Personnalisé</option>
    </select>
  </div>

  <app-qcm-options-editor [options]="payload().options" [pointsMode]="effectivePointsMode()" (optionsChange)="onOptionsChange($event)" />
</div>
