<div class="play__tool-overlay">
  <app-ui-card>
    <p class="play__question-text">📋 Copier/coller — choisis un joueur</p>
    <p class="play__hint">Sa réponse deviendra la tienne une fois le temps écoulé (tu ne la vois pas avant).</p>

    <ul class="play__copy-paste-targets">
      @for (target of targets(); track target.id) {
        <li>
          <button type="button" class="btn btn-secondary" [disabled]="using()" (click)="pick.emit(target.id)">
            {{ target.pseudo }}
          </button>
        </li>
      } @empty {
        <p class="play__hint">Aucun autre joueur disponible.</p>
      }
    </ul>

    @if (error(); as message) {
      <p class="play__error">{{ message }}</p>
    }

    <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Annuler</button>
  </app-ui-card>
</div>
